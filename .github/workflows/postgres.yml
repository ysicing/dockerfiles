name: Build Postgres

env:
  TZ: Asia/Shanghai

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 6'
  push:
    paths:
    - 'postgres/**'
    - 'Taskfile.yml'
    - '.github/workflows/postgres.yml'
    branches:
    - master
jobs:
  build:
    name: build postgres image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v7
    - name: Install Task
      uses: go-task/setup-task@v2
      with:
        version: 3.45.4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and test PostgreSQL on amd64 and arm64
      timeout-minutes: 25
      shell: bash
      run: |
        for architecture in amd64 arm64; do
          image="postgres-smoke:${architecture}"
          docker buildx build --pull --platform "linux/${architecture}" \
            --load --tag "$image" postgres
          bash postgres/tests/smoke.sh "$image" "linux/${architecture}"
        done
    - name: Login GHCR
      uses: docker/login-action@v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCRIO }}
    - name: Login DockerHub
      uses: docker/login-action@v4.8.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and publish tested PostgreSQL image
      run: |
        task postgres

