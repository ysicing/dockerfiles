master:
  push:
    - <<: *build-god
      ifModify: ["god/**", ".github/workflows/god.yml", ".cnb.yml"]
    - <<: *build-god-node
      ifModify: ["god-node/**", ".github/workflows/god-node.yml", ".cnb.yml"]
    - <<: *build-goa
      ifModify: ["goa/**", ".github/workflows/goa.yml", ".cnb.yml"]
    - <<: *build-debian
      ifModify: ["debian/**", ".github/workflows/debian.yml", ".cnb.yml"]
    - <<: *build-caddy
      ifModify: ["caddy/**", ".github/workflows/caddy.yml", ".cnb.yml"]
    - <<: *build-postgres
      ifModify: ["postgres/**", ".github/workflows/postgres.yml", ".cnb.yml"]
    - <<: *build-mariadb
      ifModify: ["mariadb/**", ".github/workflows/mariadb.yml", ".cnb.yml"]
    - <<: *build-mysql
      ifModify: ["mysql/**", ".github/workflows/mysql.yml", ".cnb.yml"]
    - <<: *build-aitools
      ifModify: ["aitools/**", ".github/workflows/aitools.yml", ".cnb.yml"]
    - <<: *build-skopeo
      ifModify: ["skopeo/**", ".github/workflows/skopeo.yml", ".cnb.yml"]
    - <<: *build-r3m
      ifModify: ["r3m/**", ".github/workflows/r3m.yml", ".cnb.yml"]

  "crontab: 30 12 * * *":
    - *build-god
    - *build-god-node
    - *build-goa
    - *build-debian

  "crontab: 0 12 * * 6":
    - *build-caddy
    - *build-postgres
    - *build-mariadb
    - *build-mysql

"$":
  web_trigger_god:
    - *build-god
  web_trigger_god_node:
    - *build-god-node
  web_trigger_goa:
    - *build-goa
  web_trigger_debian:
    - *build-debian
  web_trigger_caddy:
    - *build-caddy
  web_trigger_postgres:
    - *build-postgres
  web_trigger_mariadb:
    - *build-mariadb
  web_trigger_mysql:
    - *build-mysql
  web_trigger_aitools:
    - *build-aitools
  web_trigger_skopeo:
    - *build-skopeo
  web_trigger_r3m:
    - *build-r3m
