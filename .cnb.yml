.docker-build: &docker-build
  runner:
    cpus: 8
  docker:
    image: cnbcool/default-build-env
  services:
    - docker
  env:
    TZ: Asia/Shanghai

.prepare-docker: &prepare-docker
  name: prepare docker
  script: |
    set -euo pipefail
    docker run --privileged --rm tonistiigi/binfmt --install all
    docker buildx create --use --name cnb-builder || docker buildx use cnb-builder
    docker buildx inspect --bootstrap
    echo "$CNB_TOKEN" | docker login "$CNB_DOCKER_REGISTRY" -u "$CNB_TOKEN_USER_NAME" --password-stdin

.build-god: &build-god
  name: build god
  <<: *docker-build
  stages:
    - *prepare-docker
    - name: build god
      script: |
        docker buildx build --pull --platform linux/amd64,linux/arm64 \
          -t "$CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG/god:latest" \
          --push god

.build-god-node: &build-god-node
  name: build god-node
  <<: *docker-build
  stages:
    - *prepare-docker
    - name: build god-node
      script: |
        docker buildx build --pull --platform linux/amd64,linux/arm64 \
          -t "$CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG/god-node:latest" \
          --push god-node

