.build-debian: &build-debian
  name: build debian
  <<: *docker-build
  stages:
    - *prepare-docker
    - name: build debian 13
      script: |
        docker buildx build --pull --platform linux/amd64,linux/arm64 \
          -t "$CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG/debian:latest" \
          -t "$CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG/debian:13" \
          --push debian/13
    - name: build debian 12
      script: |
        docker buildx build --pull --platform linux/amd64,linux/arm64 \
          -t "$CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG/debian:12" \
          --push debian/12

